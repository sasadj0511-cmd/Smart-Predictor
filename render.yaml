services:
  - type: web
      name: smart-predictor
          runtime: node
              plan: free
                  buildCommand: npm install && npm run build
                      startCommand: npm start
                          envVars:
                                - key: NODE_ENV
                                        value: production
                                              - key: GEMINI_API_KEY
                                                      scope: run
                                                            - key: APP_URL
                                                                    scope: run
                                                                          - key: TELEGRAM_BOT_TOKEN
                                                                                  scope: run
                                                                                        - key: TELEGRAM_CHAT_ID
                                                                                                scope: run
                                                                                                      - key: SPORTMONKS_API_TOKEN
                                                                                                              scope: run
                                                                                                                    - key: PERPLEXITY_API_KEY
                                                                                                                            scope: run
